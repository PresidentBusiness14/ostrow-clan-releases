name: Verify Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate prerelease tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install verification tools
        run: npm install --no-audit --no-fund playwright@1.56.1
      - name: Download audited candidate and baseline
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          if ($env:CANDIDATE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid tag' }
          gh release download $env:CANDIDATE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'Ostrow-Clan-Setup-*.exe' --pattern 'update.json' --dir candidate
          gh release download verification-baseline-0.1.1 --repo $env:GITHUB_REPOSITORY --pattern '*.exe' --dir baseline
      - name: Verify real Windows install and preservation
        shell: pwsh
        run: |
          $baseline = (Get-ChildItem baseline/*.exe).FullName
          $candidate = (Get-ChildItem candidate/*.exe).FullName
          node windows-verify-release.mjs "$baseline" "$candidate" candidate/update.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: |
            windows-verification.json
            windows-update-settings.png
