name: Verify Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate prerelease tag
        required: true
        type: string
      diagnostics:
        description: Trace the old uninstaller only; this is not a release gate
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install verification tools
        run: npm install --no-audit --no-fund playwright@1.62.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Download audited candidate and baseline
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          if ($env:CANDIDATE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid tag' }
          gh release download $env:CANDIDATE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'Ostrow-Clan-Setup-*.exe' --pattern 'update.json' --dir candidate
          gh release download v0.1.2 --repo $env:GITHUB_REPOSITORY --pattern '*.exe' --dir baseline
      - name: Install baseline and populate profile
        env:
          DEBUG: pw:browser
        shell: pwsh
        run: |
          $baseline = (Get-ChildItem baseline/*.exe).FullName
          $candidate = (Get-ChildItem candidate/*.exe).FullName
          $install = Start-Process $baseline -ArgumentList '/S' -PassThru
          if (-not $install.WaitForExit(120000) -or $install.ExitCode -ne 0) { throw 'Baseline install failed' }
          node windows-verify-release.mjs seed "$candidate" candidate/update.json
          if ($LASTEXITCODE -ne 0) { throw 'Profile setup failed' }
      - name: Diagnose the disposable installation environment
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter 'Ostrow Clan.exe' -Recurse | Select-Object -First 1
          $dir = $exe.DirectoryName
          Write-Output "Install directory: $dir"
          Write-Output "TEMP: $env:TEMP; TMP: $env:TMP"
          Get-ChildItem $dir | Select-Object Name, Length
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object DisplayName -eq 'Ostrow Clan' | Select-Object UninstallString, InstallLocation, DisplayVersion
          $locked = @()
          Get-ChildItem $dir -File -Recurse | ForEach-Object {
            $path = $_.FullName; $probe = $path + '.ci-probe'
            try { [IO.File]::Move($path, $probe); [IO.File]::Move($probe, $path) }
            catch { $locked += ($path + ': ' + $_.Exception.Message); if (Test-Path $probe) { [IO.File]::Move($probe, $path) } }
          }
          $locked | Write-Output
          $test = Join-Path $dir 'ci-volume-probe.tmp'
          $destination = Join-Path $env:TEMP 'ci-volume-probe.tmp'
          [IO.File]::WriteAllText($test, 'synthetic probe')
          Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public static class NativeMove { [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern bool MoveFile(string from, string to); }'
          if ([NativeMove]::MoveFile($test, $destination)) { Write-Output 'Native cross-directory rename works'; Remove-Item $destination }
          else { Write-Output ('Native rename error: ' + [Runtime.InteropServices.Marshal]::GetLastWin32Error()); Remove-Item $test }
          if ($locked.Count -gt 0) { throw 'A disposable installation file is locked' }
      - name: Trace the old uninstaller in the disposable profile
        if: inputs.diagnostics
        shell: pwsh
        run: |
          python -m pip install frida==17.27.4
          python windows-trace-uninstall.py
      - name: Upgrade and verify every customization
        if: ${{ !inputs.diagnostics }}
        env:
          DEBUG: pw:browser
        shell: pwsh
        run: |
          $candidate = (Get-ChildItem candidate/*.exe).FullName
          node windows-verify-release.mjs verify "$candidate" candidate/update.json
          if ($LASTEXITCODE -ne 0) { throw 'Preservation or updater check failed' }
      - name: Run the embedded editable source tests on Windows
        if: ${{ !inputs.diagnostics }}
        shell: pwsh
        run: |
          $candidate = (Get-ChildItem candidate/*.exe).FullName
          & 'C:\Program Files\7-Zip\7z.exe' x -y -oembedded "$candidate" '$DOCUMENTS/*'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract editable source' }
          $source = Join-Path $PWD 'embedded\$DOCUMENTS\Ostrow Clan\Customize with Codex'
          npm test --prefix "$source"
          if ($LASTEXITCODE -ne 0) { throw 'Editable source tests failed' }
      - name: Capture synthetic Windows failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $image = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $graphics = [System.Drawing.Graphics]::FromImage($image)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $image.Save((Join-Path $PWD 'windows-desktop-failure.png'))
          $graphics.Dispose(); $image.Dispose()
          Get-Process | Where-Object { $_.Name -match 'Ostrow|Uninstall|Setup' } | Select-Object Name, MainWindowTitle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: |
            windows-verification.json
            windows-update-settings.png
            windows-desktop-failure.png
